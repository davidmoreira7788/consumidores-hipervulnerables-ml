[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "consumidores_hipervulnerables"
version = "0.0.1"
description = "Clasificación del rubro de reclamos de consumidores hipervulnerables (Argentina)."
authors = [
  { name = "David Moreira" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["consumidores_hipervulnerables"]
include = ["pyproject.toml", "consumidores_hipervulnerables/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["consumidores_hipervulnerables"]
force-sort-within-sections = true

